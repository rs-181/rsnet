name: Auto Unzip Project Files

on:
  push:
    paths:
      - 'rsnet-getrs.zip' # Jab bhi yeh zip file upload hogi, yeh action chalega
  workflow_dispatch: # Agar aap manually chalana chahein toh iska option bhi diya hai

jobs:
  unzip-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Code ko wapas save (push) karne ki permission

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract zip file
        run: |
          # Zip file ko overwrite mode (-o) ke sath extract karega
          unzip -o rsnet-getrs.zip -d ./
          
          # Extract hone ke baad purani zip file ko delete kar dega taaki space bache
          rm rsnet-getrs.zip

      - name: Commit and Push extracted files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-extracted rsnet-getrs.zip and removed archive" || echo "No changes to commit"
          git push
